<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Visão - Task 03</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .caixa-principal {
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            line-height: 1.6;
            color: #333333;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="caixa-principal">
        <p id="mensagem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam quod consectetur molestias minus quasi vel sapiente.</p>
        <button onclick="alterarTexto()">Clique Aqui</button>
    </div>

    <script>
        function alterarTexto() {
            document.getElementById('mensagem').innerText = "Parabéns! Desafio de Git/GitHub concluído com sucesso! 🎉";
        }
    </script>
</body>
</html>
